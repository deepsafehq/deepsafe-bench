# Pinned requirements for DeepSafe Monolith Inference Server
# Generated from working A6000-48GB deployment (2026-04-08, Python 3.11.15)
# Updated 2026-04-08: added insightface + onnxruntime-gpu for SCRFD face
# detection (5-10x faster than MTCNN). See VIDEO_INFERENCE_OPTIMIZATIONS.md.
#
# Install procedure:
#   1. uv venv --python 3.11
#   2. source .venv/bin/activate
#   3. uv pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cu121
#   4. uv pip install -r monolith/requirements.lock --index-url https://download.pytorch.org/whl/cu121 --extra-index-url https://pypi.org/simple
#   5. Build fairseq from source (see monolith/setup.sh)
#
# Also tested with PyTorch 2.11.0 + CUDA 12.6 (all optimizations work).

