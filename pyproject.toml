[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsafe-bench"
version = "1.0.0"
description = "Benchmark, model zoo and adaptation toolkit for deepfake detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Siddharth Kumar Sah" }]
keywords = ["deepfake", "detection", "benchmark", "model-zoo"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# `deepsafe eval` and `deepsafe fit --tier 1` deliberately need nothing beyond
# the standard library, so the benchmark is checkable on any machine.
dependencies = []

[project.optional-dependencies]
# Fetching dataset tiers and model weights.
hub = ["huggingface_hub>=0.20"]
# Running the models: the inference server and gateway.
server = [
    "torch", "pillow", "numpy", "opencv-python", "fastapi>=0.135.0", "uvicorn",
    "pydantic>=2.0.0", "python-multipart", "sqlalchemy", "redis", "PyJWT",
    "prometheus-client", "celery[redis]", "aiohttp", "cryptography",
    "lightgbm", "xgboost", "alembic", "scikit-learn", "pandas", "requests",
]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "httpx", "black", "flake8", "isort"]

[project.urls]
Homepage = "https://github.com/deepsafehq/deepsafe-bench"
Benchmark = "https://github.com/deepsafehq/deepsafe-bench/blob/main/BENCHMARK.md"
Models = "https://huggingface.co/deepsafe/model-code"
Dataset = "https://huggingface.co/datasets/deepsafe/evaluation-dataset"

[project.scripts]
deepsafe = "deepsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepsafe = ["assets/*.csv.gz"]

[tool.uv]
managed = true

[tool.black]
line-length = 88
target-version = ['py39']
extend-exclude = '''
/(
    model_code
    | models/.*/code
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["app"]
extend_skip_glob = ["model_code/*", "*/model_code/*", "models/*/code/*", "models/*/*/code/*", "models/video/fake-stormer/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps/gateway", "apps/inference", "packages/shared"]
testpaths = ["tests/unit", "apps/gateway/tests", "apps/inference/tests"]
python_files = ["test_*.py", "*_test.py", "verify_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require running Docker containers)",
    "unit: marks tests as unit tests (fast, no external dependencies)",
]
