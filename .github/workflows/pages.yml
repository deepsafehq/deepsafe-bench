name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Landing site at the root, docs under /docs.
      - name: Build landing
        run: cd apps/web && CI=true NEXT_PUBLIC_BASE_PATH=/deepsafe-bench pnpm build
      - name: Build docs
        run: cd apps/docs && CI=true pnpm build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r apps/web/out/* _site/
          mkdir -p _site/docs
          cp -r apps/docs/out/* _site/docs/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
